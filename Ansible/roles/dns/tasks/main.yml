---
- name: Configure the DNS server
  when: "'dns_servers' in group_names"
  block:
    - name: Install dnsmasq to DNS server(s)
      ansible.builtin.package:
        name: dnsmasq
        state: present

    - name: Set dnsmasq config
      ansible.builtin.template:
        src: dnsmasq.conf.j2
        dest: /etc/dnsmasq.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart dnsmasq

    - name: Start dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: true

    - name: Configure firewall for dns
      ansible.posix.firewalld:
        service: dns
        permanent: true
        immediate: true
        state: enabled

- name: Disable NetworkManager DNS management
  ansible.builtin.template:
    src: 90-dns-none.conf.j2
    dest: /etc/NetworkManager/conf.d/90-dns-none.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager

- name: Configure resolver
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
