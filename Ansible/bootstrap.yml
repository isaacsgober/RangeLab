---
- name: Bootstrap the ansible service account
  hosts: all
  become: true
  tasks:

    - name: Create ansible service account
      ansible.builtin.user:
        name: ansible
        groups: wheel
        append: true
        shell: /bin/bash
        create_home: true
        state: present

    - name: Authorize control node key for ansible
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') ~ '/.ssh/id_ed25519.pub') }}"

    - name: Create sudoers dropin for ansible
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
