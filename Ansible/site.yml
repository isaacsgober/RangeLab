---
- name: Base config and optional pkg updates for all nodes
  hosts: all
  become: true
  tasks:

    - name: Create user labadmin
      ansible.builtin.user:
        name: labadmin
        groups: wheel
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      tags:
        - always

    - name: Create user labadmin .ssh directory
      ansible.builtin.file:
        path: /home/labadmin/.ssh
        state: directory
        owner: labadmin
        group: labadmin
        mode: "0700"
      tags:
        - always

    - name: Deploy labadmin public key
      ansible.builtin.copy:
        src: files/labadmin.pub
        dest: /home/labadmin/.ssh/authorized_keys
        owner: labadmin
        group: labadmin
        mode: "0600"
      tags:
        - always

    - name: Install base utils
      ansible.builtin.dnf:
        name: "{{ base_utils }}"
        state: present
      tags: 
        - always

    - name: Create journald dropin directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - always

    - name: Create journal log directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "2755"
      tags:
        - always
      notify:
        - Restart journald
        - Flush journald

    - name: Deploy journald config
      ansible.builtin.copy:
        src: files/journald-rangelab.conf
        dest: /etc/systemd/journald.conf.d/rangelab.conf
        owner: root
        group: root
        mode: "0644"
      tags:
        - always
      notify:
        - Restart journald
        - Flush journald

# Inert in this lab; using local DVD repo.
# Kept for future update path.
# Run with `--tags update`.
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
      tags: 
        - never
        - update

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
    - name: Flush journald
      ansible.builtin.command:
        cmd: journalctl --flush
      changed_when: false
